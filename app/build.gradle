plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ccs.maple'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.ccs.maple'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '0.1.2 Preview'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release signing reads keystore.properties in the project root (not committed).
    // Without that file, release builds are unsigned.
    signingConfigs {
        release {
            def props = rootProject.file('keystore.properties')
            if (props.exists()) {
                def p = new Properties()
                props.withInputStream { p.load(it) }
                storeFile rootProject.file(p['storeFile'])
                // Passwords come from environment variables, so they are never written to disk.
                // Falls back to keystore.properties if those variables are not set.
                storePassword System.getenv('MAPLE_STORE_PASSWORD') ?: p['storePassword']
                keyAlias p['keyAlias']
                keyPassword System.getenv('MAPLE_KEY_PASSWORD') ?: p['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            // QEMU is shipped as lib*.so executables that must exist on disk to be exec()ed.
            useLegacyPackaging true
            // They are already stripped; AGP cannot strip PIE executables reliably.
            keepDebugSymbols += ['**/libqemu-*.so']
        }
    }

    androidResources {
        // Firmware blobs are extracted on first run; let the APK compress them (edk2 is zero padded).
        noCompress += []
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure-Java XZ decoder for .xz images from the OS library. No Kotlin, no AndroidX.
    implementation 'org.tukaani:xz:1.10'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (the Android one is a stub there).
    testImplementation 'org.json:json:20240303'
}
